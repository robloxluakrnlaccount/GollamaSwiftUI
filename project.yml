name: Gollama
options:
  deploymentTarget:
    iOS: "26.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources
targets:
  Gollama:
    type: application
    platform: iOS
    sources:
      - path: Gollama.swift
      - path: AppIcon.icon
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Gollama
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
